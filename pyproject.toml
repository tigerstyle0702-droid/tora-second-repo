[project]
name = "login-package"
version = "0.1.0"
description = "Flask login package"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["Flask>=2.3"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["login_package"]
include-package-data = true
